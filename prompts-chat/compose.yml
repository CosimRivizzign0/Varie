# prompts.chat self-hosted — stack minimo (app + PostgreSQL)
# Basato su https://github.com/f/prompts.chat/blob/main/DOCKER.md
#
# Avvio:  ./avvia.sh        (genera .env con segreti casuali e parte)
# Manuale: cp .env.example .env  ->  compila  ->  docker compose up -d

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: prompts
      # Nessun default: se manca in .env il comando si ferma invece di partire con "prompts/prompts"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?manca POSTGRES_PASSWORD: copia .env.example in .env}"
      POSTGRES_DB: prompts
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Nessuna porta pubblicata sull'host: il DB è raggiungibile solo dalla rete interna di compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prompts -d prompts"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    image: ghcr.io/f/prompts.chat:latest
    restart: unless-stopped
    ports:
      - "${PORT:-4444}:3000"
    environment:
      DATABASE_URL: "postgresql://prompts:${POSTGRES_PASSWORD}@db:5432/prompts?schema=public"
      DIRECT_URL: "postgresql://prompts:${POSTGRES_PASSWORD}@db:5432/prompts?schema=public"
      # Se AUTH_SECRET è vuoto l'immagine ne genera uno nuovo a ogni riavvio => tutti scollegati.
      AUTH_SECRET: "${AUTH_SECRET:?manca AUTH_SECRET: copia .env.example in .env}"
      NODE_ENV: production

      # --- Branding e lingua (tutto runtime, nessuna ricompilazione) ---
      PCHAT_NAME: "${PCHAT_NAME:-La mia libreria di prompt}"
      PCHAT_DESCRIPTION: "${PCHAT_DESCRIPTION:-Prompt raccolti e organizzati}"
      PCHAT_COLOR: "${PCHAT_COLOR:-#6366f1}"
      PCHAT_LOCALES: "${PCHAT_LOCALES:-it,en}"
      PCHAT_DEFAULT_LOCALE: "${PCHAT_DEFAULT_LOCALE:-it}"

      # --- Accesso ---
      PCHAT_AUTH_PROVIDERS: "${PCHAT_AUTH_PROVIDERS:-credentials}"
      # false = nessuno può registrarsi da solo (istanza privata). Vedi README, punto 4.
      PCHAT_ALLOW_REGISTRATION: "${PCHAT_ALLOW_REGISTRATION:-true}"

      # --- OAuth (opzionali, attivi solo se li elenchi in PCHAT_AUTH_PROVIDERS) ---
      AUTH_GITHUB_ID: "${AUTH_GITHUB_ID:-}"
      AUTH_GITHUB_SECRET: "${AUTH_GITHUB_SECRET:-}"
      AUTH_GOOGLE_ID: "${AUTH_GOOGLE_ID:-}"
      AUTH_GOOGLE_SECRET: "${AUTH_GOOGLE_SECRET:-}"

      # --- Funzioni AI (opzionali, richiedono OPENAI_API_KEY a consumo) ---
      PCHAT_FEATURE_AI_SEARCH: "${PCHAT_FEATURE_AI_SEARCH:-false}"
      PCHAT_FEATURE_AI_GENERATION: "${PCHAT_FEATURE_AI_GENERATION:-false}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
